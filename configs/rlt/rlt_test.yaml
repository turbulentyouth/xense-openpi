# RLT (RL-token) example config.
#
# Two separated phases:
#   token_training:  phase one - offline supervised training of the RL-token
#                    encoder-decoder on the prefix hidden states of a FROZEN
#                    VLA SFT checkpoint, computed over a LeRobot dataset.
#   rl:              phase two - online RL during real-robot inference; only the
#                    MLP heads are updated, the encoder-decoder stays frozen.
#                    Budget is counted in episodes.
#
# The file stem is the config name; exp_name is supplied on the CLI.

model:
  state_dim: 20
  action_dim: 20
  num_rl_tokens: 1 # RLinf-proven value; z_rl dim = num_rl_tokens * d_model
  d_model: 2048
  dim_feedforward: 8192
  prefix_seq_len: 768 # 3 cameras x 256 SigLIP tokens
  image_only: true

token_training:
  vla_config: pi05_base_bi_flexiv_pick_up_cube_0824_h100 # TrainConfig name (configs/_examples/)
  vla_checkpoint: /path/to/sft/checkpoint # PyTorch safetensors dir (convert JAX orbax first)
  repo_id: Xense/pick_up_cube_0713
  num_train_steps: 50000
  batch_size: 256

rl:
  algorithm:
    type: TD # RL-token native TD (TD3-style); `type: PPO` selects the on-policy alternative
  total_episodes: 500
  exploration_noise_std: 0.1
  # env_endpoint: ws://192.168.2.50:9100  # None (default) = local environment
